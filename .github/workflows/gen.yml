---
name: codegen
"on":
  push:
    branches-ignore:
      - create-pull-request/**
  schedule:
    - cron: 00 4 * * *
  workflow_dispatch: ~
permissions: {}
jobs:
  gen:
    uses: melodium-tech/github-actions/.github/workflows/melodium-ubuntu.yml@v0.10.0
    with:
      version: 0.10.0
      command: |
        run --api-report --logs 'logs/melodium.log' .melodium-ci/Compo.toml genEntrypoint --github_contexts '{ "github": ${{ toJSON(github) }}, "vars": ${{ toJSON(vars) }}, "secrets": { "GITHUB_TOKEN": "'"$GITHUB_TOKEN"'" } }' 
      artifact-path: logs/
    secrets:
      github-token: "${{ secrets.GITHUB_TOKEN }}"
      melodium-api-token: "${{ secrets.MELODIUM_API_TOKEN }}"
